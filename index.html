<!DOCTYPE html>

<html>
    <head>
<title>Snake Game</title>
<style>
    canvas { 
        border: 2px solid #000;
    }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #f0f0f0;
    }
    #score {
        font-size: 24px;
        margin: 10px;
    }
    #startBtn {
        margin: 10px;
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
    }
</style>
    </head>
    <body>
        <div id="score">Pontuação: 0</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button id="startBtn">Começar Jogo</button>
        <script>
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById('score');
            const startBtn = document.getElementById('startBtn');

            const gridSize = 20;
            const tileCount = canvas.width / gridSize;

            let snake = [];
            let food = {};
            let dx = gridSize;
            let dy = 0;
            let score = 0;
            let gameLoop;
            let nextDirection = null;
            let gameStarted = false;

            function initGame() {
                snake = [
                    { x:5 * gridSize, y:5 * gridSize},
                    { x:4 * gridSize, y:5 * gridSize},
                    { x:3 * gridSize, y:5 * gridSize}

                ];
                dx = gridSize;
                dy = 0;
                score = 0;
                nextDirection = null;
                scoreElement.textContent = `Pontuação: ${score}`;
                generateFood();
            }

            function generateFood() {
                food = {
                    x: Math.floor(Math.random() * tileCount) * gridSize,
                    y: Math.floor(Math.random() * tileCount) * gridSize
                };
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        generateFood();
                    }
                }
            }
             function drawGame() {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'green';
                for (let segment of snake) {
                    ctx.fillRect(segment.x, segment.y, gridSize - 2, gridSize - 2);
                }

                ctx.fillStyle = 'red';
                ctx.fillRect(food.x, food.y,gridSize - 2, gridSize -2);
             }

             function updateGame() {
                if (nextDirection) {
                    dx = nextDirection.dx;
                    dy = nextDirection.dy;
                    nextDirection = null;
                }
                const head = {
                    x: snake[0].x + dx,
                    y: snake[0].y + dy
                };
                if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                    gameOver();
                    return;
                }

                for (let segment of snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        gameOver();
                        return;
                    }
                }
                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    score+=10;
                    scoreElement.textContent = `Pontuação: ${score}`;
                    generateFood();
                } else {
                    snake.pop();
                }
             }
             
             function gameOver() {
                clearInterval(gameLoop);
                gameStarted = false;
                startBtn.textContent = "Recomeçar Jogo";
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
             }

             function startGame() {
                if (gameLoop) clearInterval(gameLoop);
                gameStarted = true;
                startBtn.textContent = 'Em andamento...';
                initGame();
                gameLoop = setInterval(() => {
                    updateGame();
                    drawGame();
                }, 100);
             }

             document.addEventListener('keydown', (e) => {
                if (!gameStarted) return;

                switch (e.key) {
                    case 'ArrowUp':
                        if (dy !== gridSize) nextDirection = { dx: 0, dy: -gridSize};
                        break;
                    case 'ArrowDown':
                            if (dy !== -gridSize) nextDirection = {dx: 0, dy: gridSize};
                            break;
                    case 'ArrowLeft':
                        if (dx !== gridSize) nextDirection = { dx: -gridSize, dy: 0};
                            break;
                    case 'ArrowRight':
                            if (dx !== -gridSize) nextDirection = {dx: gridSize, dy: 0};
                            break;
                }
             });

             startBtn.addEventListener('click',startGame);

             drawGame();
        </script>
    </body>

</html>
